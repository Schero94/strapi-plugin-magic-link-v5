# Checks every pull request and manual run: lint, formatting, tests, build and
# package verification on every Node major Strapi 5.63 supports (engines.node).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Dependency gate unit tests
        run: node --test .github/scripts/dependency-gate.test.mjs

      - name: Compatibility canary unit tests
        run: node --test .github/scripts/compat-canary.test.mjs

      - name: Showcase script unit tests
        run: node --test .github/scripts/showcase.test.mjs
      - name: Admin StrictMode tests (React 18)
        run: npm run test:admin
      - name: Build
        run: npm run build
      - name: Verify package
        run: |
          npm run verify
          npm run verify:runtime
      - name: Package contents
        run: npm pack --dry-run
      - name: Production audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  # Informational: the peer range is React ^18, like the Strapi 5 admin, and stays so. This job
  # runs the admin StrictMode tests against React 19 (RFC strapi/strapi#25739) to see problems
  # before Strapi moves; a failure here does not block a pull request.
  react-19:
    name: Admin StrictMode tests on React 19 (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Install React 19 (not saved)
        run: npm install --no-save --legacy-peer-deps --ignore-scripts react@19 react-dom@19
      - name: Show installed React version
        run: node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"
      - name: Admin StrictMode tests (React 19)
        run: npm run test:admin

  # Several Strapi processes on one database (Railway replicas, pm2 cluster):
  # 8 Node processes run the shared-state scenarios against SQLite and
  # PostgreSQL 16 (tests/cluster/run.cjs). Synthetic data only.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi-ci-only
          POSTGRES_DB: magic_link_cluster
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build the SQLite driver (native addon, skipped by --ignore-scripts)
        run: npm rebuild better-sqlite3
      - name: Cluster test (SQLite)
        run: npm run test:cluster
      - name: Cluster test (PostgreSQL)
        run: npm run test:cluster
        env:
          ML_CLUSTER_DB: postgres
          ML_CLUSTER_PG_URL: postgres://strapi:strapi-ci-only@localhost:5432/magic_link_cluster

  # The @strapi/strapi peer floor (package.json ^5.50.0) runs on a real Strapi
  # host: tests/host/strapi-host.test.cjs boots Strapi with this plugin and
  # drives magic-link login, admin session revocation and token rejection over
  # HTTP in both users-permissions JWT modes. Strapi 5.50.0 added the
  # session-manager method revokeSessionById the revocation uses; on 5.49.0
  # and older the refresh-mode revocation answers 500. The same suite also
  # runs against the devDependency Strapi (the acceptance version).
  strapi-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRAPI_FLOOR: 5.50.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build the plugin
        run: npm run build
      - name: Install the Strapi floor host
        run: |
          mkdir -p "$RUNNER_TEMP/strapi-floor"
          cd "$RUNNER_TEMP/strapi-floor"
          echo '{"name":"strapi-floor-host","version":"0.0.0","private":true}' > package.json
          npm install --no-audit --no-fund \
            "@strapi/strapi@$STRAPI_FLOOR" "@strapi/plugin-users-permissions@$STRAPI_FLOOR" better-sqlite3@12
          for pkg in strapi core plugin-users-permissions; do
            version=$(node -p "require('./node_modules/@strapi/$pkg/package.json').version")
            echo "@strapi/$pkg $version"
            test "$version" = "$STRAPI_FLOOR"
          done
      - name: Host suite on the floor (refresh and legacy-support)
        env:
          ML_HOST_REQUIRED: '1'
          ML_HOST_STRAPI_NODE_MODULES: ${{ runner.temp }}/strapi-floor/node_modules
        run: |
          ML_HOST_JWT_MODE=refresh node --test tests/host/strapi-host.test.cjs
          ML_HOST_JWT_MODE=legacy-support node --test tests/host/strapi-host.test.cjs
      - name: Build the SQLite driver for the acceptance version (skipped by --ignore-scripts)
        run: npm rebuild better-sqlite3
      - name: Host suite on the devDependency Strapi (refresh and legacy-support)
        env:
          ML_HOST_REQUIRED: '1'
          ML_HOST_STRAPI_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: |
          ML_HOST_JWT_MODE=refresh node --test tests/host/strapi-host.test.cjs
          ML_HOST_JWT_MODE=legacy-support node --test tests/host/strapi-host.test.cjs
